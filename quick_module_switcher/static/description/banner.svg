    <circle cx="1027" cy="101" r="25" fill="none" stroke="#ff3b30" stroke-width="5"/>
    <path d="M1004 72l-18-19" fill="none" stroke="#ff3b30" stroke-width="5" stroke-linecap="round"/>
    <path d="M982 52l5 16 12-12z" fill="#ff3b30"/>

