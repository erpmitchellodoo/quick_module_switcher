<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="500" viewBox="0 0 1200 500">
    <defs>
        <clipPath id="screen-clip">
            <rect x="650" y="83" width="500" height="300" rx="12"/>
        </clipPath>
        <filter id="screen-shadow" x="-20%" y="-20%" width="140%" height="150%">
            <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#2f3542" flood-opacity="0.24"/>
        </filter>
    </defs>

    <rect width="1200" height="500" fill="#f4f0f3"/>
    <rect width="1200" height="12" fill="#714b67"/>

    <g transform="translate(68 73)">
        <rect width="88" height="88" rx="18" fill="#714b67"/>
        <rect x="15" y="18" width="25" height="25" rx="5" fill="#fff"/>
        <rect x="49" y="47" width="25" height="25" rx="5" fill="#fff"/>
        <path d="M46 25h19l-6-6 6-6 15 15-15 15-6-6 6-6H46z" fill="#8fd1cf"/>
        <path d="M42 64H23l6 6-6 6L8 61l15-15 6 6-6 6h19z" fill="#f2b179"/>
    </g>

    <text x="68" y="215" fill="#2f3542" font-family="Arial, sans-serif" font-size="48" font-weight="700">Quick Module</text>
    <text x="68" y="270" fill="#2f3542" font-family="Arial, sans-serif" font-size="48" font-weight="700">Switcher</text>
    <text x="70" y="320" fill="#59636e" font-family="Arial, sans-serif" font-size="23">Personal app shortcuts</text>

    <g transform="translate(70 351)" font-family="Arial, sans-serif" font-size="17" font-weight="600">
        <rect width="140" height="42" rx="6" fill="#714b67"/>
        <text x="18" y="27" fill="#fff">Per-user setup</text>
        <rect x="153" width="148" height="42" rx="6" fill="#017e84"/>
        <text x="170" y="27" fill="#fff">Native app icons</text>
    </g>
    <text x="70" y="440" fill="#714b67" font-family="Arial, sans-serif" font-size="19" font-weight="700">FREE  |  LGPL-3  |  COMMUNITY + ENTERPRISE</text>

    <rect x="638" y="71" width="524" height="324" rx="18" fill="#ffffff" filter="url(#screen-shadow)"/>
    <image x="650" y="83" width="500" height="300" preserveAspectRatio="xMidYMid slice"
